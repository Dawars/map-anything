defaults:
  - default
  - task: images_only

# String for model factory
model_str: "casamaestro"
# Model config
model_config:
  name: "casamaestro_no_mask"
  # Checkpoint path (released as CasaMeastro_no_mask.pt on Hugging Face:
  # https://huggingface.co/AutoLab-SJTU/CasaMeastro)
  ckpt_path: "${root_pretrained_checkpoints_dir}/CasaMeastro_no_mask.pt"
  # Packaged Depth Anything 3 config defining the backbone & depth head
  da3_config: "depth_anything_3.configs.da3-base"
  # The no-mask checkpoint keeps the original Depth Anything 3 camera decoder
  use_pano_cam_dec: False
# Image Normalization Type
data_norm_type: "dinov2"
# CasaMaestro checkpoint is already loaded in the inference wrapper
pretrained: null
# Torch hub force reload
torch_hub_force_reload: False
